upstream solidity_api {
  server api:8000;
}

upstream solidity_dashboard {
  server dashboard:80;
}

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://solidity_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://solidity_dashboard/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
