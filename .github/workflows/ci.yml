name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          if [ -d tests ]; then
            pytest -q --cov=. --cov-report=term-missing --cov-report=html
          else
            echo "No tests directory found; skipping pytest."
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: htmlcov/
          retention-days: 30
        continue-on-error: true

      - name: Lint package syntax
        run: python -m compileall .

      - name: Run security scan and generate SARIF
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from fastapi_api import app
          from fastapi.testclient import TestClient
          from report_generator import generate_sarif_report
          
          client = TestClient(app)
          
          # Test contract with known vulnerability
          test_contract = '''pragma solidity ^0.8.0;
          contract Test {
              function withdraw(uint256 amount) public {
                  (bool success, ) = msg.sender.call{value: amount}(\"\");
                  require(success);
              }
          }'''
          
          response = client.post('/analyze', json={
              'contract_code': test_contract,
              'contract_name': 'Test',
              'use_llm_audit': False
          })
          
          if response.status_code == 200:
              result = response.json()
              import json
              sarif = generate_sarif_report(result, source_code=test_contract)
              with open('results.sarif', 'w') as f:
                  json.dump(sarif, f, indent=2)
              print('SARIF report generated')
          else:
              print(f'Analysis failed: {response.status_code}')
              sys.exit(1)
          "
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # SV-1-1 / SV-3-3: Validate SARIF schema and enforce --fail-on severity gate
  sarif-gate:
    name: SARIF Schema Validation & Severity Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt jsonschema

      - name: Validate SARIF output against official schema (SV-1-1)
        run: |
          python - <<'PYEOF'
          import json, sys, hashlib, urllib.request
          sys.path.insert(0, ".")
          from static_analyzer import StaticAnalyzer
          from report_generator import generate_sarif_report

          schema_url = "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json"
          try:
              with urllib.request.urlopen(schema_url, timeout=15) as r:
                  sarif_schema = json.load(r)
          except Exception as e:
              print(f"Warning: could not fetch SARIF schema ({e}) — skipping schema validation")
              sys.exit(0)

          from jsonschema import validate, ValidationError

          test_code = """pragma solidity ^0.8.0;
          contract Test {
              function withdraw(uint256 a) public { (bool s,) = msg.sender.call{value: a}(""); }
          }"""
          result = StaticAnalyzer().analyze(test_code, "Test").to_dict()
          sarif = generate_sarif_report(result, source_code=test_code)

          # Verify scanManifest fields present (SV-2-1)
          manifest = sarif["runs"][0]["properties"].get("scanManifest", {})
          assert manifest.get("sourceHash"), "scanManifest.sourceHash missing"
          assert manifest.get("toolVersion"), "scanManifest.toolVersion missing"
          assert manifest.get("analysisTimestamp"), "scanManifest.analysisTimestamp missing"
          print(f"scanManifest OK: sourceHash={manifest['sourceHash'][:12]}...")

          try:
              validate(instance=sarif, schema=sarif_schema)
              print("SARIF schema validation: PASS")
          except ValidationError as exc:
              print(f"SARIF schema validation: FAIL — {exc.message}")
              sys.exit(1)
          PYEOF

      - name: CLI --fail-on HIGH gate smoke test (SV-3-3)
        run: |
          python - <<'PYEOF'
          import subprocess, sys, textwrap, tempfile, pathlib

          vuln_contract = textwrap.dedent("""
          pragma solidity ^0.8.0;
          contract Vuln {
              function withdraw(uint256 a) public { (bool s,) = msg.sender.call{value: a}(""); }
          }
          """)
          with tempfile.NamedTemporaryFile(suffix=".sol", mode="w", delete=False) as f:
              f.write(vuln_contract)
              sol_path = f.name

          # --fail-on HIGH should exit 1 when reentrancy (HIGH+) is detected
          r = subprocess.run(
              ["python", "cli.py", sol_path, "--fail-on", "HIGH", "--quiet"],
              capture_output=True,
          )
          pathlib.Path(sol_path).unlink(missing_ok=True)
          if r.returncode != 1:
              print(f"Expected exit 1 from --fail-on HIGH on vulnerable contract, got {r.returncode}")
              sys.exit(1)
          print("--fail-on HIGH gate: PASS (exit 1 on HIGH+ finding)")
          PYEOF

  # Performance benchmarks (full suite on main, smoke check on PRs)
  # Runs separately, doesn't block PRs
  performance-smoke:
    runs-on: ubuntu-latest
    # Run on: main branch merges, workflow_dispatch, or PRs (smoke check only)
    if: |
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run performance benchmarks
        run: |
          if [ -d benchmarks ]; then
            # On PRs, run only small contract (smoke check)
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              pytest benchmarks/test_performance.py::TestPerformanceBenchmarks::test_analyze_small -v --tb=short
            else
              # Full benchmark suite on main/workflow_dispatch
              pytest benchmarks/test_performance.py -v --tb=short
            fi
          else
            echo "No benchmarks directory found; skipping."
          fi
        continue-on-error: true

      - name: Upload benchmark results as artifact
        uses: actions/upload-artifact@v3
        if: always() && (github.event_name != 'pull_request' || github.ref == 'refs/heads/main')
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            benchmarks/results.json
            benchmarks/results.md
          retention-days: 30
        continue-on-error: true

      - name: Check for performance regressions
        if: always() && (github.event_name != 'pull_request' || github.ref == 'refs/heads/main')
        run: |
          if [ -f benchmarks/results.json ]; then
            python3 -c "
            import json
            import sys
            
            with open('benchmarks/results.json') as f:
                results = json.load(f)
            
            regressions = []
            for size, data in results.get('contracts', {}).items():
                if data.get('regression_detected'):
                    regressions.append(f\"{size}: {data.get('median_time_seconds', 0):.3f}s (baseline: {data.get('baseline_time_seconds', 0):.3f}s)\")
            
            if regressions:
                print('⚠️  Performance regressions detected:')
                for r in regressions:
                    print(f'  - {r}')
                print('\\nNote: This is informational. CI thresholds are loose to avoid flakiness.')
            else:
                print('✅ No significant performance regressions detected.')
            "
          else
            echo "No benchmark results file found."
          fi
        continue-on-error: true

